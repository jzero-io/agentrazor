banner:
    text: agentrazor

rest:
    name: agentrazor-api
    host: 0.0.0.0
    port: 8001
    timeout: 20000
    maxBytes: 104857600

jwt:
    accessExpire: 1800
    refreshExpire: 2592000

log:
    encoding: plain
    level: info
    mode: file

sqlx:
    datasource: "${DATASOURCE:-postgres://root:123456@localhost:5432/agentrazor}"
    driverName: "${DRIVER_NAME:-pgx}"

redis:
    miniRedis: ${REDIS_MINI_REDIS:-true}
    host: "${REDIS_HOST:-127.0.0.1:6379}"

i18n:
    dir: etc/locale
