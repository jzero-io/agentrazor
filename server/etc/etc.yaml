banner:
    text: agentrazor

rest:
    name: agentrazor-api
    host: 0.0.0.0
    port: 8001
    timeout: 20000

jwt:
    accessExpire: 1800
    refreshExpire: 2592000

log:
    encoding: plain
    level: info
    mode: file

sqlx:
#    datasource: "${DATASOURCE:-root:123456@tcp(127.0.0.1:3306)/agentrazor?charset=utf8mb4&parseTime=True&loc=Local}"
#    driverName: "${DRIVER_NAME:-mysql}"
#    datasource: "${DATASOURCE:-postgres://root:123456@localhost:5432/agentrazor}"
#    driverName: "${DRIVER_NAME:-pgx}"
    datasource: "${DATASOURCE:-agentrazor.db}"
    driverName: "${DRIVER_NAME:-sqlite}"

redis:
    miniRedis: ${REDIS_MINI_REDIS:-true}
    host: "${REDIS_HOST:-127.0.0.1:6379}"

agent:
    binaryPath: "${CODEX_BINARY_PATH:-codex}"
    codexHome: "${CODEX_HOME_PATH:-data/codex-home}"
    agentrazorHome: "${AGENTRAZOR_HOME_PATH:-data/agentrazor-home}"
    sandbox: "${AGENT_SANDBOX:-read-only}"
    startTimeoutSeconds: 15
