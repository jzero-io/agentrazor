<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram 问答机器人</title>
  <script>
    if (window.top === window) window.location.replace('/plugins/telegram-chat-bot');
  </script>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2937; background: transparent; }
    html[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; }
    .page { max-width: 980px; margin: 0 auto; padding: 24px; }
    .header { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 7px; color: #4779d7; font-size: 13px; font-weight: 700; }
    h1 { margin: 0; font-size: 24px; line-height: 1.3; }
    .subtitle { margin: 8px 0 0; color: #667085; font-size: 14px; line-height: 1.65; }
    .status { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 7px 11px; border-radius: 999px; color: #667085; background: #f2f4f7; font-size: 13px; white-space: nowrap; }
    .status::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; content: ""; }
    .status.ok { color: #16805d; background: #ecfdf3; }
    .status.warn { color: #a56700; background: #fff7e6; }
    .panel { padding: 20px; border: 1px solid #e5eaf2; border-radius: 10px; background: #fff; box-shadow: 0 2px 10px rgb(27 49 80 / 3%); }
    .panel h2 { margin: 0; font-size: 16px; }
    .panel > p { margin: 6px 0 18px; color: #98a2b3; font-size: 13px; line-height: 1.55; }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .summary-card { padding: 14px; border-radius: 8px; background: #f8fafc; }
    .summary-label { color: #98a2b3; font-size: 12px; }
    .summary-value { margin-top: 6px; color: #344054; font-size: 22px; font-weight: 720; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; gap: 7px; min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    label { color: #475467; font-size: 13px; font-weight: 650; }
    input { width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid #d8dee9; border-radius: 7px; color: #202938; background: #fff; font: inherit; font-size: 13px; outline: none; }
    input:focus { border-color: #4d8eff; box-shadow: 0 0 0 3px rgb(77 142 255 / 13%); }
    .tip { color: #98a2b3; font-size: 12px; line-height: 1.45; }
    .actions { display: flex; align-items: center; justify-content: flex-end; gap: 14px; margin-top: 18px; }
    .notice { margin-right: auto; color: #7a8699; font-size: 13px; }
    .notice.error { color: #b42318; }
    button { min-width: 120px; height: 36px; border: 0; border-radius: 7px; color: #fff; background: #3478f6; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; }
    button:hover:not(:disabled) { background: #2563d5; }
    button:disabled { cursor: wait; opacity: .65; }
    :root[data-theme="dark"] { color: #e4e7ec; }
    :root[data-theme="dark"] .subtitle, :root[data-theme="dark"] .tip { color: #aeb8c8; }
    :root[data-theme="dark"] .panel { border-color: #303946; background: #20242b; box-shadow: none; }
    :root[data-theme="dark"] .summary-card { background: #272d36; }
    :root[data-theme="dark"] .summary-value { color: #f2f4f7; }
    :root[data-theme="dark"] label { color: #d0d5dd; }
    :root[data-theme="dark"] input { color: #f2f4f7; border-color: #3b4553; background: #272d36; }
    @media (max-width: 700px) { .page { padding: 16px; } .header, .actions { flex-direction: column; align-items: stretch; } .summary, .grid { grid-template-columns: 1fr; } .status, button { width: 100%; justify-content: center; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <p class="eyebrow">TELEGRAM Q&A</p>
        <h1>Telegram 群聊问答机器人</h1>
        <p class="subtitle">机器人只处理允许群聊中明确 @机器人 的文本消息。Token 和 AgentRazor API Key 保存在数据库中并加密，不会回显。</p>
      </div>
      <span class="status" id="bot-status">读取中</span>
    </header>

    <section class="panel">
      <h2>连接配置</h2>
      <p>保存后会立即校验并重连 Telegram。群聊 ID 通常是负数，例如 <code>-1001234567890</code>。</p>
      <div class="summary">
        <div class="summary-card"><div class="summary-label">允许群聊</div><div class="summary-value" id="group-count">—</div></div>
        <div class="summary-card"><div class="summary-label">TG 会话</div><div class="summary-value" id="conversation-count">—</div></div>
        <div class="summary-card"><div class="summary-label">Bot 用户名</div><div class="summary-value" id="bot-username">—</div></div>
      </div>
      <form id="config-form">
        <div class="grid">
          <div class="field wide"><label for="bot-token">Telegram Bot Token</label><input id="bot-token" type="password" autocomplete="new-password" placeholder="未配置"><span class="tip">已配置时留空保持原值。</span></div>
          <div class="field wide"><label for="group-ids">允许的群聊 ID</label><input id="group-ids" placeholder="-1001234567890"><span class="tip">多个群 ID 用英文逗号分隔。只处理这些群内 @机器人的消息。</span></div>
          <div class="field"><label for="telegram-api-base">Telegram API 地址</label><input id="telegram-api-base" value="https://api.telegram.org"></div>
          <div class="field"><label for="poll-timeout">长轮询超时（秒）</label><input id="poll-timeout" type="number" min="1" max="50"></div>
          <div class="field"><label for="request-timeout">Telegram 请求超时（秒）</label><input id="request-timeout" type="number" min="1"></div>
          <div class="field"><label for="conversation-timeout">AgentRazor 回答超时（秒）</label><input id="conversation-timeout" type="number" min="1"></div>
          <div class="field wide"><label for="conversation-base">AgentRazor 服务地址</label><input id="conversation-base" value="http://127.0.0.1:8001"></div>
          <div class="field wide"><label for="conversation-api-key">AgentRazor API Key</label><input id="conversation-api-key" type="password" autocomplete="new-password" placeholder="未配置"><span class="tip">已配置时留空保持原值。</span></div>
        </div>
        <div class="actions"><span class="notice" id="notice">正在读取配置</span><button type="submit" id="save">保存并应用</button></div>
      </form>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const pending = new Map();
    let sequence = 0;

    function applyTheme() {
      try {
        document.documentElement.dataset.theme = window.top.document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      } catch (_) {}
    }
    applyTheme();

    function callHostApi(path, method = 'GET', body) {
      if (window.parent === window) return Promise.reject(new Error('请从 AgentRazor 管理后台打开此页面'));
      const requestId = `telegram-plugin-${Date.now()}-${sequence++}`;
      return new Promise((resolve, reject) => {
        const timeout = window.setTimeout(() => { pending.delete(requestId); reject(new Error('管理后台未响应插件请求')); }, 15000);
        pending.set(requestId, { resolve, reject, timeout });
        window.parent.postMessage({ type: 'agentrazor:plugin-api-request', requestId, method, path, body }, window.location.origin);
      });
    }

    window.addEventListener('message', event => {
      if (event.origin !== window.location.origin || event.source !== window.parent) return;
      const message = event.data || {};
      if (message.type === 'agentrazor:host-context') {
        document.documentElement.dataset.theme = message.theme === 'dark' ? 'dark' : 'light';
        document.documentElement.lang = message.locale === 'en-US' ? 'en' : 'zh-CN';
        return;
      }
      if (message.type !== 'agentrazor:plugin-api-response') return;
      const item = pending.get(message.requestId);
      if (!item) return;
      pending.delete(message.requestId);
      clearTimeout(item.timeout);
      message.error ? item.reject(new Error(message.error)) : item.resolve(message.data);
    });

    function setStatus(data) {
      const node = $('bot-status');
      node.textContent = data.botRunning ? `运行中${data.botUsername ? ` · @${data.botUsername}` : ''}` : (data.tokenConfigured ? '等待连接' : '未配置');
      node.className = `status ${data.botRunning ? 'ok' : 'warn'}`;
      $('group-count').textContent = data.allowedGroups ?? 0;
      $('conversation-count').textContent = data.conversationCount ?? 0;
      $('bot-username').textContent = data.botUsername ? `@${data.botUsername}` : '—';
    }

    function renderConfiguration(data) {
      const cfg = data.config || {}, telegram = cfg.telegram || {}, conversation = cfg.conversation || {}, secrets = data.secrets || {};
      $('group-ids').value = telegram.groupChatIDs || '';
      $('telegram-api-base').value = telegram.apiBaseURL || 'https://api.telegram.org';
      $('poll-timeout').value = telegram.pollTimeoutSeconds || 25;
      $('request-timeout').value = telegram.requestTimeoutSeconds || 40;
      $('conversation-base').value = conversation.baseURL || 'http://127.0.0.1:8001';
      $('conversation-timeout').value = conversation.timeoutSeconds || 600;
      $('bot-token').placeholder = secrets.telegramBotToken ? '已配置，留空保持原值' : '未配置';
      $('conversation-api-key').placeholder = secrets.conversationAPIKey ? '已配置，留空保持原值' : '未配置';
    }

    async function load() {
      const notice = $('notice');
      try {
        const [status, configuration] = await Promise.all([
          callHostApi('/api/v1/plugin/admin/telegram_chat_bot/status'),
          callHostApi('/api/v1/plugin/admin/telegram_chat_bot/configuration')
        ]);
        setStatus(status || {});
        renderConfiguration(configuration || {});
        notice.classList.remove('error');
        notice.textContent = configuration.updatedAt ? `配置已加载 · ${new Date(configuration.updatedAt).toLocaleString()}` : '尚未保存数据库配置';
      } catch (error) {
        notice.classList.add('error');
        notice.textContent = error.message || '无法读取配置';
      }
    }

    $('config-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = $('save'), notice = $('notice');
      button.disabled = true;
      button.textContent = '应用中';
      notice.classList.remove('error');
      notice.textContent = '正在校验并重载 Telegram 网关';
      try {
        const data = await callHostApi('/api/v1/plugin/admin/telegram_chat_bot/configuration', 'PUT', { config: {
          telegram: {
            botToken: $('bot-token').value,
            groupChatIDs: $('group-ids').value,
            apiBaseURL: $('telegram-api-base').value,
            pollTimeoutSeconds: Number($('poll-timeout').value) || 0,
            requestTimeoutSeconds: Number($('request-timeout').value) || 0
          },
          conversation: {
            baseURL: $('conversation-base').value,
            apiKey: $('conversation-api-key').value,
            timeoutSeconds: Number($('conversation-timeout').value) || 0
          }
        }});
        $('bot-token').value = '';
        $('conversation-api-key').value = '';
        renderConfiguration(data);
        setStatus(await callHostApi('/api/v1/plugin/admin/telegram_chat_bot/status'));
        notice.textContent = '配置已保存并应用';
      } catch (error) {
        notice.classList.add('error');
        notice.textContent = error.message || '保存失败，原配置未变更';
      } finally {
        button.disabled = false;
        button.textContent = '保存并应用';
      }
    });

    load();
  </script>
</body>
</html>
