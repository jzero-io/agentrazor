server {
    listen       80;
    server_name  localhost;
    client_max_body_size 100m;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $server_backend server:8001;
    # Dynamic menus are obtained after the Admin SPA boots. Keep its HTML
    # entry uncached so a deployed menu-route change cannot leave a browser
    # running an older in-memory route that opens a plugin as a standalone
    # page. Hashed JS/CSS assets remain cacheable.
    location = /index.html {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;
    }
    location /api {
        proxy_pass http://$server_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # A plugin's embedded Admin page is a serverless static asset. Keep this
    # narrower than /plugins/: the latter is an Admin SPA route such as
    # /plugins/discord-chat-bot and must resolve to index.html/layout.base.
    location ~ ^/plugins/[^/]+/admin(?:/|$) {
        proxy_pass http://$server_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /plugins/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
