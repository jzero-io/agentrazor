services:
  codex:
    image: ghcr.io/jzero-io/agentrazor-codex:v0.1.0
    pull_policy: always
    restart: always
    container_name: agentrazor-codex
    init: true
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/codex/app-server.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    volumes:
      - ./codex/data:/dist/data
      - codex-socket:/run/codex
    environment:
      - TZ=Asia/Shanghai
      - AGENTRAZOR_BASE_URL=http://server:8001
      - AGENTRAZOR_API_KEY=${AGENTRAZOR_API_KEY:-}
      - LARK_BOT_WEBHOOK_URL=${LARK_BOT_WEBHOOK_URL:-}

  server:
    image: ghcr.io/jzero-io/agentrazor-server:v0.1.0
    pull_policy: always
    restart: always
    container_name: agentrazor-server
    init: true
    depends_on:
      codex:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8001/api/version"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./server/logs:/dist/logs
      - codex-socket:/run/codex
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Asia/Shanghai
      - DRIVER_NAME=pgx
      - DATASOURCE=postgres://root:123456@postgres:5432/agentrazor
      - REDIS_HOST=redis:6379
      - CODEX_HOME=/dist/data
      - AGENTRAZOR_HOME=/dist/data/agentrazor-home
      - CODEX_SOCKET=/run/codex/app-server.sock

  admin:
    image: ghcr.io/jzero-io/agentrazor-admin:v0.1.0
    pull_policy: always
    restart: always
    container_name: agentrazor-admin
    depends_on:
      server:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8443:80"

  agent:
    image: ghcr.io/jzero-io/agentrazor-agent:v0.1.0
    pull_policy: always
    restart: always
    container_name: agentrazor-agent
    depends_on:
      server:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"

  postgres:
    image: postgres
    restart: always
    container_name: agentrazor-postgres
    shm_size: "1gb"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_PASSWORD: 123456
      POSTGRES_USER: root
      POSTGRES_DB: agentrazor
    volumes:
      - ./postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:latest
    restart: always
    container_name: agentrazor-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  codex-socket:
