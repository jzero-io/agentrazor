services:
  server:
    image: ghcr.io/jzero-io/agentrazor-server:v0.1.0
    pull_policy: always
    restart: always
    container_name: agentrazor-server
    init: true
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8001/api/version"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./server/data:/dist/data
      - ./server/logs:/dist/logs
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DRIVER_NAME=pgx
      - DATASOURCE=postgres://root:123456@postgres:5432/agentrazor
      - REDIS_HOST=redis:6379

  web:
    image: ghcr.io/jzero-io/agentrazor-web:v0.1.0
    pull_policy: always
    restart: always
    container_name: agentrazor-web
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8443:80"

  agent:
    image: ghcr.io/jzero-io/agentrazor-agent:v0.1.0
    pull_policy: always
    restart: always
    container_name: agentrazor-agent
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"

  postgres:
    image: postgres
    restart: always
    container_name: agentrazor-postgres
    shm_size: "1gb"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_PASSWORD: 123456
      POSTGRES_USER: root
      POSTGRES_DB: agentrazor
    volumes:
      - ./postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:latest
    restart: always
    container_name: agentrazor-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
