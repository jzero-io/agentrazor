services:
  server:
    build:
      context: ../../server
    restart: always
    container_name: agentrazor-server
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8001/api/version"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./server/data:/dist/data
      - ./server/logs:/dist/logs
    environment:
      - TZ=Asia/Shanghai
      - DRIVER_NAME=pgx
      - DATASOURCE=postgres://root:123456@postgres:5432/agentrazor
      - REDIS_HOST=redis:6379
  web:
    build:
      context: ../../web
    restart: always
    container_name: agentrazor-web
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./nginx:/etc/nginx/conf.d
    environment:
      - TZ=Asia/Shanghai
      - VITE_SERVICE_BASE_URL=http://127.0.0.1
    ports:
      - "8443:80"
  agent:
    build:
      context: ../../agent
    restart: always
    container_name: agentrazor-agent
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./nginx:/etc/nginx/conf.d
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
  postgres:
    image: postgres
    restart: always
    container_name: agentrazor-postgres
    shm_size: "1gb"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_PASSWORD: 123456
      POSTGRES_USER: root
      POSTGRES_DB: agentrazor
    volumes:
      - ./postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "5432:5432"
  redis:
    image: redis:latest
    restart: always
    container_name: agentrazor-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "6379:6379"