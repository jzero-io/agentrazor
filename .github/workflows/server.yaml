name: server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/server.yaml'

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache-dependency-path: server/go.sum

      - name: Test server
        working-directory: server
        run: go test ./...
